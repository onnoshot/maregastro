<!doctype html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#EEF2F8">
<title>Mare Gastro · Yönetim</title>
<style>
:root{
  --bg:#EEF2F8; --surface:rgba(255,255,255,.70); --surface2:rgba(255,255,255,.5);
  --ink:#0B0E14; --ink2:#4B5566; --ink3:#8891A0;
  --line:rgba(15,25,45,.10); --line2:rgba(15,25,45,.07);
  --gold:#2E4C81; --gold-deep:#16294A; --gold-soft:#7C97C4; --gold-bg:#E5EBF7;
  --sage:#2E7D5B; --sage-bg:#E3F3EA;
  --red:#C1443A; --red-bg:#FBEAE8;
  --grey-bg:#EBEEF3;
  --glass-blur:blur(26px) saturate(160%);
  --sf:-apple-system,BlinkMacSystemFont,'SF Pro Display','Helvetica Neue',sans-serif;
  --ease:cubic-bezier(.22,1,.36,1);
  --safe-b:env(safe-area-inset-bottom,0px);
  --shadow-sm:0 1px 2px rgba(15,23,42,.06), 0 1px 1px rgba(15,23,42,.04);
  --shadow-md:0 6px 20px -6px rgba(15,23,42,.14), 0 2px 8px -2px rgba(15,23,42,.07);
  --shadow-lg:0 24px 56px -18px rgba(15,23,42,.30);
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html,body{background:var(--bg)}
body{color:var(--ink);font-family:var(--sf);min-height:100vh;-webkit-font-smoothing:antialiased;font-size:15px;position:relative}
body::before,body::after{content:'';position:fixed;z-index:-1;pointer-events:none;filter:blur(70px)}
body::before{top:-12%;left:-14%;width:62%;height:48%;background:radial-gradient(circle, rgba(46,76,129,.18), transparent 70%)}
body::after{bottom:-16%;right:-12%;width:58%;height:50%;background:radial-gradient(circle, rgba(124,151,196,.20), transparent 70%)}
input,button,textarea,select{font-family:inherit;font-size:inherit}
button{cursor:pointer}
::selection{background:rgba(46,76,129,.22)}
svg{display:block;flex:none}
a{color:inherit}

/* ── Liquid glass panels ── */
.login-card,.card,.chip-stat,.agenda-item,.rez-card,.searchbar,.stat-card,.chart-card,.cal-card,.cat-block,.sheet,.topbar,.tabbar{
  backdrop-filter:var(--glass-blur);-webkit-backdrop-filter:var(--glass-blur);
}

/* ── Login ── */
#login{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;background:
  radial-gradient(circle at 50% -10%, #E4EBF6 0%, var(--bg) 55%)}
.login-card{background:var(--surface);border:1px solid var(--line);border-radius:26px;padding:38px 28px;max-width:340px;width:100%;text-align:center;box-shadow:var(--shadow-md)}
.login-mark{width:54px;height:54px;border-radius:16px;background:linear-gradient(135deg,var(--gold-soft),var(--gold));margin:0 auto 18px;display:flex;align-items:center;justify-content:center;box-shadow:var(--shadow-sm)}
.login-mark svg{width:26px;height:26px;color:#fff}
.login-card h1{font-size:1.05rem;letter-spacing:.02em;margin-bottom:4px;color:var(--ink)}
.login-card p{font-size:12.5px;color:var(--ink2);margin-bottom:22px}
.login-card input{width:100%;background:var(--surface2);border:1px solid var(--line);border-radius:13px;padding:14px 16px;color:var(--ink);font-size:15px;outline:none;margin-bottom:12px;text-align:center}
.login-card input:focus{border-color:var(--gold-soft);background:var(--surface)}
.login-card button{width:100%;background:linear-gradient(135deg,var(--gold-soft),var(--gold));border:none;border-radius:13px;padding:14px;font-weight:700;font-size:14px;letter-spacing:.02em;color:#FFFFFF;transition:transform .15s var(--ease)}
.login-card button:active{transform:scale(.97)}
.login-err{color:var(--red);font-size:12px;margin-top:10px;min-height:14px}

/* ── App shell ── */
#app{display:none;min-height:100vh;min-height:100dvh}
.topbar{position:sticky;top:0;z-index:30;background:rgba(238,242,248,.78);border-bottom:1px solid var(--line2);padding:14px 18px calc(14px);display:flex;align-items:center;justify-content:space-between}
.topbar-inner{max-width:560px;margin:0 auto;width:100%;display:flex;align-items:center;justify-content:space-between}
.topbar h1{font-size:1.2rem;letter-spacing:-.01em;font-weight:700}
.topbar .today{font-size:11.5px;color:var(--ink2);margin-top:1px;font-weight:500}
.topbar-btns{display:flex;gap:8px}
.roundbtn{width:36px;height:36px;border-radius:11px;background:var(--surface);border:1px solid var(--line);display:flex;align-items:center;justify-content:center;color:var(--ink2);transition:all .15s}
.roundbtn:hover{background:var(--surface2);color:var(--ink)}
.roundbtn svg{width:17px;height:17px}

.content{max-width:560px;margin:0 auto;padding:18px 16px calc(108px + var(--safe-b))}
.page{display:none}
.page.on{display:block;animation:fadein .25s var(--ease)}
@keyframes fadein{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}

/* ── Bottom tab bar ── */
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:40;background:rgba(255,255,255,.65);border-top:1px solid var(--line2);padding:7px 6px calc(7px + var(--safe-b));display:flex;justify-content:center;box-shadow:0 -1px 0 rgba(255,255,255,.5)}
.tabbar-inner{max-width:560px;width:100%;display:flex;justify-content:space-around}
.tabbtn{display:flex;flex-direction:column;align-items:center;gap:3px;background:none;border:none;color:var(--ink3);padding:6px 8px;border-radius:12px;min-width:56px;transition:color .15s}
.tabbtn svg{width:22px;height:22px;transition:transform .15s var(--ease)}
.tabbtn span{font-size:10px;font-weight:600;letter-spacing:.01em}
.tabbtn.on{color:var(--gold-deep)}
.tabbtn.on svg{transform:translateY(-1px) scale(1.04)}
.tabbtn:active svg{transform:scale(.9)}

/* ── FAB ── */
.fab{position:fixed;right:calc(50% - 280px + 18px);bottom:calc(78px + var(--safe-b));z-index:35;width:54px;height:54px;border-radius:50%;background:linear-gradient(135deg,var(--gold-soft),var(--gold));border:none;box-shadow:var(--shadow-lg);display:flex;align-items:center;justify-content:center;color:#FFFFFF;transition:transform .15s var(--ease)}
.fab svg{width:24px;height:24px}
.fab:active{transform:scale(.92)}
@media(max-width:596px){.fab{right:18px}}
.fab.hide{display:none}

/* ── Cards / common ── */
.card{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:16px;box-shadow:var(--shadow-sm)}
.section-title{font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--ink3);margin:22px 2px 10px}
.section-title:first-child{margin-top:0}
.hello{font-size:1.5rem;font-weight:700;letter-spacing:-.02em;margin-bottom:2px}
.hello-sub{font-size:13px;color:var(--ink2);margin-bottom:20px}

.chips{display:flex;gap:9px;overflow-x:auto;padding-bottom:2px;margin-bottom:6px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip-stat{flex:none;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:13px 16px;min-width:104px;box-shadow:var(--shadow-sm)}
.chip-stat .n{font-size:1.5rem;font-weight:800;color:var(--ink);line-height:1}
.chip-stat .n.gold{color:var(--gold-deep)}
.chip-stat .n.red{color:var(--red)}
.chip-stat .l{font-size:10.5px;color:var(--ink2);margin-top:5px;font-weight:600;letter-spacing:.01em}

.btn{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 16px;color:var(--ink);font-size:13px;font-weight:600;letter-spacing:.01em;transition:all .15s;white-space:nowrap}
.btn:hover{background:var(--surface2)}
.btn.gold{background:linear-gradient(135deg,var(--gold-soft),var(--gold));color:#FFFFFF;border:none}
.btn.ghost-red{color:var(--red);border-color:rgba(177,74,59,.3)}
.btn.sm{padding:8px 13px;font-size:12px}
.btn.block{width:100%}

.empty{color:var(--ink2);font-size:13px;padding:36px 20px;text-align:center}
.empty svg{width:34px;height:34px;color:var(--ink3);margin:0 auto 10px}

/* status pill */
.pill{display:inline-flex;align-items:center;gap:5px;padding:4px 10px;border-radius:20px;font-size:10.5px;font-weight:700;letter-spacing:.02em}
.pill::before{content:'';width:6px;height:6px;border-radius:50%;background:currentColor}
.pill.st-pending{background:var(--gold-bg);color:var(--gold-deep)}
.pill.st-confirmed{background:var(--sage-bg);color:var(--sage)}
.pill.st-cancelled{background:var(--red-bg);color:var(--red)}
.pill.st-done{background:var(--grey-bg);color:var(--ink3)}

/* ── Agenda / reservation rows ── */
.agenda-list,.rez-list{display:flex;flex-direction:column;gap:10px}
.agenda-item,.rez-card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:13px 14px;display:flex;gap:12px;align-items:flex-start;box-shadow:var(--shadow-sm)}
.agenda-time{flex:none;width:52px;text-align:center;padding-top:2px}
.agenda-time .t{font-size:14px;font-weight:800;color:var(--gold-deep)}
.agenda-body{flex:1;min-width:0}
.agenda-top{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:4px}
.agenda-name{font-size:14px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.agenda-meta{font-size:11.5px;color:var(--ink2);display:flex;flex-wrap:wrap;gap:5px 8px}
.agenda-meta .dot{opacity:.5}
.agenda-note{font-size:11.5px;color:var(--ink3);margin-top:5px;font-style:italic;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row-actions{display:flex;gap:6px;flex:none}
.iconbtn{width:30px;height:30px;border-radius:9px;background:var(--surface2);border:1px solid var(--line);display:flex;align-items:center;justify-content:center;color:var(--ink2)}
.iconbtn:hover{color:var(--ink);background:var(--gold-bg)}
.iconbtn svg{width:14px;height:14px}
.iconbtn.danger:hover{color:var(--red);background:var(--red-bg)}

/* ── Rezervasyonlar toolbar ── */
.searchbar{display:flex;align-items:center;gap:8px;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:11px 14px;margin-bottom:12px}
.searchbar svg{width:16px;height:16px;color:var(--ink3);flex:none}
.searchbar input{border:none;background:none;outline:none;flex:1;color:var(--ink);font-size:14px}
.filter-row{display:flex;gap:8px;margin-bottom:14px;overflow-x:auto;scrollbar-width:none}
.filter-row::-webkit-scrollbar{display:none}
.filter-row select{flex:none;background:var(--surface);border:1px solid var(--line);border-radius:11px;padding:8px 12px;color:var(--ink);font-size:12.5px;font-weight:600;outline:none}
.seg{display:flex;background:var(--surface2);border:1px solid var(--line);border-radius:12px;padding:3px;gap:2px;flex:none}
.seg button{background:none;border:none;padding:7px 12px;border-radius:9px;color:var(--ink2);font-size:12px;font-weight:600}
.seg button.on{background:var(--surface);color:var(--gold-deep);box-shadow:var(--shadow-sm)}
.datepick{display:flex;align-items:center;gap:6px;flex:none;background:var(--surface2);border:1px solid var(--line);border-radius:11px;padding:7px 10px;color:var(--ink2)}
.datepick svg{width:14px;height:14px;flex:none}
.datepick input[type=date]{background:none;border:none;outline:none;color:var(--ink);font-size:12px;font-weight:600;padding:0;width:98px}
.datepick.active{background:var(--gold-bg);border-color:var(--gold-soft);color:var(--gold-deep)}
.datepick-clear{width:16px;height:16px;border-radius:50%;background:var(--line);border:none;display:flex;align-items:center;justify-content:center;color:var(--ink2);flex:none}
.datepick-clear svg{width:9px;height:9px}

/* ── Stats page ── */
.stat-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:8px}
.stat-card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:15px;box-shadow:var(--shadow-sm);display:flex;flex-direction:column;gap:8px}
.stat-card .ic{width:26px;height:26px;border-radius:9px;background:var(--gold-bg);color:var(--gold-deep);display:flex;align-items:center;justify-content:center}
.stat-card .ic svg{width:14px;height:14px}
.stat-card .ic.warn{background:var(--red-bg);color:var(--red)}
.stat-card .n{font-size:1.55rem;font-weight:800;color:var(--ink);font-variant-numeric:tabular-nums}
.stat-card .n.warn{color:var(--red)}
.stat-card .l{font-size:10.5px;color:var(--ink2);letter-spacing:.02em;font-weight:600}
.chart-card{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:16px 14px 14px;margin-bottom:12px;box-shadow:var(--shadow-sm)}
.chart-card-head{display:flex;align-items:flex-start;justify-content:space-between;gap:10px;margin-bottom:10px}
.chart-card h3{font-size:.82rem;color:var(--ink);letter-spacing:.01em;margin-bottom:2px;font-weight:700}
.chart-card .sub{font-size:11px;color:var(--ink2)}
.chart-legend{display:flex;gap:14px;font-size:10.5px;color:var(--ink2);margin-bottom:8px;font-weight:600}
.chart-legend span{display:inline-flex;align-items:center;gap:5px}
.chart-legend i{width:8px;height:8px;border-radius:2px;display:inline-block}
.chart-empty{color:var(--ink2);font-size:12px;padding:20px 0;text-align:center}
.seg.sm button{padding:5px 10px;font-size:10.5px}

/* Floating chart tooltip */
#chartTip{position:fixed;z-index:200;pointer-events:none;background:var(--ink);color:#EEF2F8;font-size:11.5px;font-weight:700;padding:7px 11px;border-radius:9px;box-shadow:var(--shadow-md);opacity:0;transform:translateY(4px) scale(.96);transition:opacity .12s,transform .12s;max-width:220px;letter-spacing:.01em}
#chartTip.on{opacity:1;transform:translateY(0) scale(1)}

/* Animated bars */
.bar-grow{transform-box:fill-box;transform-origin:50% 100%;transform:scaleY(0);transition:transform .65s cubic-bezier(.22,1,.36,1)}
.bar-grow.on{transform:scaleY(1)}
.hbar-grow{transform-box:fill-box;transform-origin:0% 50%;transform:scaleX(0);transition:transform .65s cubic-bezier(.22,1,.36,1)}
.hbar-grow.on{transform:scaleX(1)}
[data-tip]{cursor:pointer}

/* Donut chart */
.donut-row{display:flex;align-items:center;gap:18px;flex-wrap:wrap}
.donut-wrap{position:relative;flex:none;width:132px;height:132px}
.donut-wrap svg{width:100%;height:100%}
.donut-seg{transition:stroke-dasharray .8s cubic-bezier(.22,1,.36,1)}
.donut-center{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;pointer-events:none}
.donut-center .dc-n{font-size:1.35rem;font-weight:800;color:var(--ink)}
.donut-center .dc-l{font-size:9px;color:var(--ink2);font-weight:600;letter-spacing:.02em;text-transform:uppercase}
.donut-legend{flex:1;min-width:140px;display:flex;flex-direction:column;gap:7px}
.donut-legend-row{display:flex;align-items:center;gap:8px;font-size:11.5px;padding:4px 0}
.donut-legend-row i{width:9px;height:9px;border-radius:3px;flex:none}
.donut-legend-row .ll{flex:1;color:var(--ink);font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.donut-legend-row .lv{color:var(--ink2);font-weight:700;font-variant-numeric:tabular-nums}
.donut-legend-row .lp{color:var(--ink3);font-weight:600;min-width:30px;text-align:right;font-variant-numeric:tabular-nums}

/* ── Calendar ── */
.cal-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px}
.cal-head .label{font-size:1.05rem;font-weight:800;letter-spacing:-.01em}
.cal-nav{display:flex;gap:8px;align-items:center}
.cal-card{background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:14px;box-shadow:var(--shadow-sm);margin-bottom:16px}
.cal-dow-row{display:grid;grid-template-columns:repeat(7,1fr);margin-bottom:6px}
.cal-dow{font-size:10px;color:var(--ink3);text-align:center;font-weight:700;letter-spacing:.02em}
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:3px}
.cal-cell{position:relative;aspect-ratio:1/1;border-radius:12px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;background:none;border:none;color:var(--ink);transition:background .15s}
.cal-cell.off{color:var(--ink3);opacity:.35}
.cal-cell .dnum{font-size:12.5px;font-weight:600}
.cal-cell.load-1{background:rgba(46,76,129,.07)}
.cal-cell.load-2{background:rgba(46,76,129,.15)}
.cal-cell.load-3{background:rgba(46,76,129,.25)}
.cal-cell.load-4{background:rgba(46,76,129,.38)}
.cal-count{font-size:8.5px;font-weight:800;color:var(--gold-deep);opacity:.8;letter-spacing:-.01em}
.cal-cell.off .cal-count{display:none}
.cal-cell.today .dnum{color:var(--gold-deep);font-weight:800}
.cal-cell.today::after{content:'';position:absolute;inset:1px;border:1.5px solid var(--gold-soft);border-radius:12px}
.cal-cell.sel{background:linear-gradient(135deg,var(--gold-soft),var(--gold));box-shadow:var(--shadow-sm)}
.cal-cell.sel .dnum{color:#FFFFFF;font-weight:800}
.cal-cell.sel .cal-count{color:#FFFFFF;opacity:.85}
.cal-legend{display:flex;align-items:center;justify-content:center;gap:5px;margin-top:12px;font-size:9.5px;color:var(--ink3);font-weight:600}
.cal-legend .sw{width:12px;height:12px;border-radius:4px;display:inline-block}

.daypanel-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
.daypanel-head h3{font-size:.95rem;font-weight:700}
.daypanel-head .cnt{font-size:11.5px;color:var(--ink2);font-weight:600}

/* ── Menu editor ── */
.mgroup-sel{display:flex;gap:8px;margin-bottom:16px}
.mgroup-sel button{flex:1;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:11px;color:var(--ink2);font-size:12.5px;font-weight:700}
.mgroup-sel button.on{color:var(--gold-deep);border-color:var(--gold-soft);background:var(--gold-bg)}
.cat-block{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:15px;margin-bottom:12px;box-shadow:var(--shadow-sm)}
.cat-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px;gap:10px}
.cat-head h3{font-size:.92rem;color:var(--ink);font-weight:700}
.cat-head .meta{font-size:10px;color:var(--ink3);letter-spacing:.02em;text-transform:uppercase;font-weight:600}
.item-row{display:grid;grid-template-columns:1.3fr 1.5fr .6fr auto;gap:7px;align-items:center;padding:8px 0;border-top:1px solid var(--line2)}
.item-row input{background:var(--surface2);border:1px solid var(--line);border-radius:9px;padding:9px 10px;color:var(--ink);font-size:12.5px;outline:none;width:100%}
.item-row input[type=number]{-moz-appearance:textfield}
.item-row input[type=number]::-webkit-outer-spin-button,.item-row input[type=number]::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
.item-row input:focus{border-color:var(--gold-soft)}
.item-row .imgfield{grid-column:1/4}
@media(min-width:480px){.item-row{grid-template-columns:1.3fr 1.5fr .6fr 1fr auto}.item-row .imgfield{grid-column:auto}}
.add-item{margin-top:10px}

/* ── Toast ── */
.toast{position:fixed;bottom:calc(96px + var(--safe-b));left:50%;transform:translateX(-50%) translateY(10px);background:var(--ink);color:#EEF2F8;padding:12px 20px;border-radius:12px;font-size:13px;font-weight:600;opacity:0;transition:all .3s var(--ease);pointer-events:none;z-index:99;max-width:90vw;box-shadow:var(--shadow-lg)}
.toast.on{opacity:1;transform:translateX(-50%) translateY(0)}

/* ── Bottom-sheet modal ── */
.sheet-bg{display:none;position:fixed;inset:0;background:rgba(34,25,15,.4);backdrop-filter:blur(2px);z-index:90;align-items:flex-end;justify-content:center}
.sheet-bg.on{display:flex;animation:fadein2 .2s}
@keyframes fadein2{from{opacity:0}to{opacity:1}}
.sheet{background:var(--bg);border-radius:24px 24px 0 0;max-width:560px;width:100%;max-height:92vh;overflow-y:auto;padding:10px 20px calc(24px + var(--safe-b));animation:sheetup .28s var(--ease)}
@keyframes sheetup{from{transform:translateY(100%)}to{transform:translateY(0)}}
.sheet-handle{width:36px;height:4px;border-radius:3px;background:var(--line);margin:0 auto 14px}
.sheet h2{font-size:1.1rem;font-weight:800;letter-spacing:-.01em;margin-bottom:16px}
.field{margin-bottom:12px}
.field label{display:block;font-size:11.5px;font-weight:700;color:var(--ink2);margin-bottom:6px;letter-spacing:.01em}
.field input,.field select,.field textarea{width:100%;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 14px;color:var(--ink);font-size:15px;outline:none}
.field input:focus,.field select:focus,.field textarea:focus{border-color:var(--gold-soft)}
.field textarea{resize:vertical;min-height:60px}
.field-row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.sheet-btns{display:flex;gap:10px;margin-top:18px;position:sticky;bottom:0;background:var(--bg);padding-top:6px}
.sheet-btns .btn{flex:1;padding:13px}
.confirm-sheet .sheet{max-width:400px;border-radius:24px;text-align:center;padding:22px 22px calc(20px + var(--safe-b))}
.confirm-sheet p{font-size:13.5px;color:var(--ink2);margin:10px 0 4px;line-height:1.5}
.confirm-icon{width:46px;height:46px;border-radius:50%;background:var(--red-bg);color:var(--red);display:flex;align-items:center;justify-content:center;margin:0 auto}
.confirm-icon svg{width:22px;height:22px}

@media(min-width:480px){.field-row{grid-template-columns:1fr 1fr}}
</style>
</head>
<body>

<div id="login">
  <div class="login-card">
    <div class="login-mark"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 4.5C4 3.7 4.7 3 5.5 3H19v16.5c0 .3-.2.5-.5.5H5.5c-.8 0-1.5-.7-1.5-1.5v-14z"/><line x1="4" y1="17.5" x2="19" y2="17.5"/></svg></div>
    <h1>Mare Gastro Yönetim</h1>
    <p>Devam etmek için şifre girin</p>
    <input type="password" id="pw" placeholder="Şifre" onkeydown="if(event.key==='Enter')doLogin()">
    <button onclick="doLogin()">Giriş Yap</button>
    <div class="login-err" id="loginErr"></div>
  </div>
</div>

<div id="app">
  <header class="topbar"><div class="topbar-inner">
    <div><h1 id="pageTitle">Bugün</h1><div class="today" id="pageSub"></div></div>
    <div class="topbar-btns">
      <button class="roundbtn" onclick="loadAll()" title="Yenile"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 12a8 8 0 0114-5.3M20 12a8 8 0 01-14 5.3"/><path d="M18 3v4h-4M6 21v-4h4"/></svg></button>
      <button class="roundbtn" onclick="logout()" title="Çıkış"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M9 21H6a2 2 0 01-2-2V5a2 2 0 012-2h3"/><path d="M16 17l5-5-5-5"/><path d="M21 12H9"/></svg></button>
    </div>
  </div></header>

  <main class="content">
    <!-- ── BUGÜN (Home) ── -->
    <section class="page on" id="pageHome">
      <div class="chips" id="homeChips"></div>
      <div class="section-title">Bugünün Rezervasyonları</div>
      <div class="agenda-list" id="homeToday"></div>
      <div class="section-title">Yaklaşanlar (7 gün)</div>
      <div class="agenda-list" id="homeWeek"></div>
    </section>

    <!-- ── REZERVASYONLAR ── -->
    <section class="page" id="pageRez">
      <div class="searchbar">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
        <input type="search" id="rezSearch" placeholder="Ad, telefon veya e-posta ara..." oninput="renderRezList()">
      </div>
      <div class="filter-row">
        <div class="seg" id="rezQuickFilter">
          <button class="on" data-q="all" onclick="setQuickFilter('all')">Tümü</button>
          <button data-q="today" onclick="setQuickFilter('today')">Bugün</button>
          <button data-q="week" onclick="setQuickFilter('week')">Bu Hafta</button>
        </div>
        <div class="datepick" id="rezDatePick">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="5" width="18" height="16" rx="3"/><line x1="3" y1="10" x2="21" y2="10"/><line x1="8" y1="3" x2="8" y2="7"/><line x1="16" y1="3" x2="16" y2="7"/></svg>
          <input type="date" id="rezDateFilter" onchange="onDateFilterChange(this.value)">
          <button class="datepick-clear" id="rezDateClear" onclick="clearDateFilter()" style="display:none">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="6" y1="6" x2="18" y2="18"/><line x1="6" y1="18" x2="18" y2="6"/></svg>
          </button>
        </div>
        <select id="rezStatusFilter" onchange="renderRezList()">
          <option value="all">Tüm Durumlar</option>
          <option value="Beklemede">Beklemede</option>
          <option value="Onaylandı">Onaylandı</option>
          <option value="İptal Edildi">İptal Edildi</option>
          <option value="Tamamlandı">Tamamlandı</option>
        </select>
        <select id="rezChannelFilter" onchange="renderRezList()"><option value="all">Tüm Kaynaklar</option></select>
      </div>
      <div class="rez-list" id="rezList"></div>
    </section>

    <!-- ── TAKVİM ── -->
    <section class="page" id="pageCalendar">
      <div class="cal-card">
        <div class="cal-head">
          <button class="roundbtn" onclick="calShift(-1)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M15 18l-6-6 6-6"/></svg></button>
          <div class="label" id="calLabel"></div>
          <button class="roundbtn" onclick="calShift(1)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 18l6-6-6-6"/></svg></button>
        </div>
        <div class="cal-dow-row" id="calDowRow"></div>
        <div class="cal-grid" id="calGrid"></div>
        <div class="cal-legend">
          <span>Az</span>
          <i class="sw" style="background:rgba(46,76,129,.07)"></i>
          <i class="sw" style="background:rgba(46,76,129,.15)"></i>
          <i class="sw" style="background:rgba(46,76,129,.25)"></i>
          <i class="sw" style="background:rgba(46,76,129,.38)"></i>
          <span>Yoğun</span>
        </div>
      </div>
      <div class="daypanel-head">
        <h3 id="dayPanelTitle"></h3>
        <button class="btn sm" onclick="calToday()">Bugün</button>
      </div>
      <div class="agenda-list" id="dayPanelList"></div>
    </section>

    <!-- ── İSTATİSTİKLER ── -->
    <section class="page" id="pageStats">
      <div class="stat-grid" id="statGrid"></div>
      <div id="statCharts"></div>
    </section>

    <!-- ── MENÜ ── -->
    <section class="page" id="pageMenu">
      <button class="btn gold block" style="margin-bottom:16px" onclick="saveMenu()">Menüyü Kaydet</button>
      <div class="mgroup-sel" id="mgroupSel"></div>
      <div id="catList"></div>
    </section>
  </main>

  <button class="fab" id="fabAdd" onclick="openRezModal()">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
  </button>

  <nav class="tabbar"><div class="tabbar-inner">
    <button class="tabbtn on" data-tab="home" onclick="showTab('home')">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M3 11l9-7 9 7"/><path d="M5 10v9a1 1 0 001 1h4v-6h4v6h4a1 1 0 001-1v-9"/></svg>
      <span>Bugün</span>
    </button>
    <button class="tabbtn" data-tab="rez" onclick="showTab('rez')">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><line x1="4" y1="7" x2="20" y2="7"/><line x1="4" y1="12" x2="20" y2="12"/><line x1="4" y1="17" x2="14" y2="17"/></svg>
      <span>Rezervasyon</span>
    </button>
    <button class="tabbtn" data-tab="calendar" onclick="showTab('calendar')">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="5" width="18" height="16" rx="3"/><line x1="3" y1="10" x2="21" y2="10"/><line x1="8" y1="3" x2="8" y2="7"/><line x1="16" y1="3" x2="16" y2="7"/></svg>
      <span>Takvim</span>
    </button>
    <button class="tabbtn" data-tab="stats" onclick="showTab('stats')">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><line x1="5" y1="21" x2="5" y2="10"/><line x1="12" y1="21" x2="12" y2="4"/><line x1="19" y1="21" x2="19" y2="14"/></svg>
      <span>İstatistik</span>
    </button>
    <button class="tabbtn" data-tab="menu" onclick="showTab('menu')">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 4.5C4 3.7 4.7 3 5.5 3H19v16.5c0 .3-.2.5-.5.5H5.5c-.8 0-1.5-.7-1.5-1.5v-14z"/><line x1="4" y1="17.5" x2="19" y2="17.5"/></svg>
      <span>Menü</span>
    </button>
  </div></nav>
</div>

<!-- Rezervasyon ekle/düzenle bottom sheet -->

  <div class="sheet">

          <option value="">Belirtilmemiş</option>

      </div>
    </div>
    <div class="field-row">
      <div class="field"><label>Rezervasyon Kaynağı *</label>
        <select id="rzChannel">
          <option value="Otel Müşterisi">Otel Müşterisi</option>
          <option value="Instagram">Instagram</option>
          <option value="Telefon">Telefon</option>
          <option value="Walk-in">Walk-in</option>
        </select>
      </div>
      <div class="field"><label>Durum</label>
        <select id="rzStatus">
          <option value="Onaylandı">Onaylandı</option>
          <option value="Beklemede">Beklemede</option>

<!-- Silme onay sheet -->
<div class="sheet-bg confirm-sheet" id="delModalBg">
  <div class="sheet">
    <div class="sheet-handle"></div>
    <div class="confirm-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M5 7h14M9 7V5a1 1 0 011-1h4a1 1 0 011 1v2m-8 0v12a1 1 0 001 1h6a1 1 0 001-1V7"/></svg></div>
    <h2 style="margin-top:14px">Rezervasyonu Sil</h2>
    <p id="delModalText">Bu rezervasyon talebini silmek istediğinize emin misiniz?</p>
    <div class="sheet-btns">
      <button class="btn" onclick="closeDelModal()">Vazgeç</button>
      <button class="btn ghost-red" onclick="confirmDelete()">Sil</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>
<div id="chartTip"></div>

<script>
const API_MENU = '/api/menu';
const API_REZ  = '/api/reservation';
let ADMIN_KEY = sessionStorage.getItem('mareAdminKey') || '';
let MENU = null;
let curGroup = null;
let RESERVATIONS = [];
let curTab = 'home';
let editingId = null;
let deletingId = null;
const STATUSES = ['Beklemede','Onaylandı','İptal Edildi','Tamamlandı'];
const PAGE_TITLES = { home:'Bugün', rez:'Rezervasyonlar', calendar:'Takvim', stats:'İstatistikler', menu:'Menü' };

function toast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg; t.classList.add('on');
  setTimeout(()=>t.classList.remove('on'), 2600);
}
function escAttr(s){ return String(s||'').replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;'); }
function iconEdit(){ return `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 20l4.5-1 10-10-3.5-3.5-10 10L4 20z"/></svg>`; }
function iconTrash(){ return `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M5 7h14M9 7V5a1 1 0 011-1h4a1 1 0 011 1v2m-8 0v12a1 1 0 001 1h6a1 1 0 001-1V7"/></svg>`; }

/* ───────── AUTH ───────── */
async function doLogin(){
  const pw = document.getElementById('pw').value.trim();
  if(!pw){ document.getElementById('loginErr').textContent='Şifre girin'; return; }
  ADMIN_KEY = pw;
  try{
    const r = await fetch(API_REZ, { headers: { 'x-admin-key': ADMIN_KEY }, cache:'no-store' });
    if(r.status === 401){ document.getElementById('loginErr').textContent='Hatalı şifre'; return; }
    sessionStorage.setItem('mareAdminKey', ADMIN_KEY);
    document.getElementById('login').style.display='none';
    document.getElementById('app').style.display='block';
    loadAll();
  }catch(e){ document.getElementById('loginErr').textContent='Bağlantı hatası: '+e.message; }
}
function logout(){ sessionStorage.removeItem('mareAdminKey'); location.reload(); }

/* ───────── NAV ───────── */
function showTab(name){
  curTab = name;
  document.querySelectorAll('.tabbtn').forEach(b=> b.classList.toggle('on', b.dataset.tab===name));
  ['home','rez','calendar','stats','menu'].forEach(id=>{
    document.getElementById('page'+id[0].toUpperCase()+id.slice(1)).classList.toggle('on', id===name);
  });
  document.getElementById('pageTitle').textContent = PAGE_TITLES[name];
  document.getElementById('fabAdd').classList.toggle('hide', !['home','rez','calendar'].includes(name));
  if(name==='calendar') renderCalendar();
  window.scrollTo(0,0);
}
function setPageSub(){
  const today = new Date();
  document.getElementById('pageSub').textContent = today.toLocaleDateString('tr-TR',{day:'numeric',month:'long',year:'numeric',weekday:'long'});
}

async function loadAll(){ await Promise.all([loadMenu(), loadRez()]); }

/* ───────── MENÜ ───────── */
async function loadMenu(){
  try{
    const r = await fetch(API_MENU, { cache:'no-store' });
    const j = await r.json();
    MENU = j.data || { groups:[], categories:[], items:[] };
    if(!curGroup && MENU.groups.length) curGroup = MENU.groups[0].id;
    renderMenu();
  }catch(e){ toast('Menü yüklenemedi: '+e.message); }
}
function renderMenu(){
  const gSel = document.getElementById('mgroupSel');
  gSel.innerHTML = MENU.groups.map(g=>
    `<button class="${g.id===curGroup?'on':''}" onclick="curGroup='${g.id}';renderMenu()">${g.id==='yemek'?'Yemekler':'İçecekler'}</button>`
  ).join('');
  const cats = MENU.categories.filter(c=>c.group===curGroup);
  document.getElementById('catList').innerHTML = cats.map(c=>{
    const items = MENU.items.filter(it=>it.cat===c.id);
    const rows = items.map(it => itemRowHTML(c.id, it)).join('');
    return `<div class="cat-block">
      <div class="cat-head"><h3>${c.name_tr||c.id}</h3><span class="meta">${c.display} · ${items.length} ürün</span></div>
      ${rows}
      <button class="btn sm add-item" onclick="addItem('${c.id}')">+ Ürün Ekle</button>
    </div>`;
  }).join('') || '<div class="empty">Bu grupta kategori yok.</div>';
}
function itemRowHTML(catId, it){
  return `<div class="item-row" data-id="${it.id}">
    <input value="${escAttr(it.name)}" placeholder="İsim" onchange="updItem('${it.id}','name',this.value)">
    <input value="${escAttr(it.desc||'')}" placeholder="Açıklama" onchange="updItem('${it.id}','desc',this.value)">
    <input type="number" value="${it.price==null?'':it.price}" placeholder="Fiyat" onchange="updItem('${it.id}','price',this.value)">
    <input class="imgfield" value="${escAttr(it.img||'')}" placeholder="görsel-dosyaadi.webp" onchange="updItem('${it.id}','img',this.value)">
    <button class="iconbtn danger" onclick="delItem('${it.id}')">${iconTrash()}</button>
  </div>`;
}
function updItem(id, field, val){
  const it = MENU.items.find(x=>x.id===id); if(!it) return;
  it[field] = field==='price' ? (val===''?null:Number(val)) : val;
}
function delItem(id){
  if(!confirm('Bu ürünü silmek istediğinize emin misiniz?')) return;
  MENU.items = MENU.items.filter(x=>x.id!==id);
  renderMenu();
}
function addItem(catId){
  const id = catId+'-'+Math.random().toString(36).slice(2,8);
  MENU.items.push({ id, cat:catId, name:'Yeni Ürün', desc:'', price:null, img:null });
  renderMenu();
}
async function saveMenu(){
  try{
    const r = await fetch(API_MENU, {
      method:'PUT',
      headers:{'Content-Type':'application/json','x-admin-key':ADMIN_KEY},
      body: JSON.stringify(MENU)
    });
    const j = await r.json();
    if(r.ok && j.ok) toast('Menü kaydedildi — sitede yansıması ~20-30 saniye sürebilir');
    else toast('Hata: '+(j.error||r.status));
  }catch(e){ toast('Kaydedilemedi: '+e.message); }
}

/* ───────── REZERVASYON: veri ───────── */
async function loadRez(){
  try{
    const r = await fetch(API_REZ, { headers:{'x-admin-key':ADMIN_KEY}, cache:'no-store' });
    const j = await r.json();
    RESERVATIONS = j.items || [];
    populateChannelFilter();
    renderHome();
    renderRezList();
    renderStats();
    if(curTab==='calendar') renderCalendar();
  }catch(e){ toast('Rezervasyonlar yüklenemedi: '+e.message); }
}
function populateChannelFilter(){
  const sel = document.getElementById('rezChannelFilter');
  const cur = sel.value || 'all';
  const channels = Array.from(new Set(RESERVATIONS.map(it=>(it.channel||'Doğrudan').trim()||'Doğrudan'))).sort();
  sel.innerHTML = '<option value="all">Tüm Kaynaklar</option>' + channels.map(c=>`<option value="${escAttr(c)}">${escAttr(c)}</option>`).join('');
  sel.value = channels.includes(cur) ? cur : 'all';
}
function statusClass(s){
  if(s==='Onaylandı') return 'st-confirmed';
  if(s==='İptal Edildi') return 'st-cancelled';
  if(s==='Tamamlandı') return 'st-done';
  return 'st-pending';
}

/* ───────── Tarih yardımcıları ───────── */
const TR_MONTHS = {'ocak':0,'şubat':1,'subat':1,'mart':2,'nisan':3,'mayıs':4,'mayis':4,'haziran':5,'temmuz':6,'ağustos':7,'agustos':7,'eylül':8,'eylul':8,'ekim':9,'kasım':10,'kasim':10,'aralık':11,'aralik':11};
const TR_MONTHS_LONG = ['Ocak','Şubat','Mart','Nisan','Mayıs','Haziran','Temmuz','Ağustos','Eylül','Ekim','Kasım','Aralık'];
const TR_DOW = ['Pzt','Sal','Çar','Per','Cum','Cmt','Paz'];
function parseTRDate(s){
  if(!s) return null;
  const parts = String(s).trim().toLowerCase().split(/\s+/);
  if(parts.length!==3) return null;
  const day = parseInt(parts[0],10), month = TR_MONTHS[parts[1]], year = parseInt(parts[2],10);
  if(isNaN(day)||month==null||isNaN(year)) return null;
  return new Date(year, month, day);
}
function dKey(d){ return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }
function dLabel(d){ return String(d.getDate()).padStart(2,'0')+'.'+String(d.getMonth()+1).padStart(2,'0'); }
function sameDay(a,b){ return a.getFullYear()===b.getFullYear() && a.getMonth()===b.getMonth() && a.getDate()===b.getDate(); }
function isoToTRLong(iso){ return new Date(iso+'T00:00:00').toLocaleDateString('tr-TR',{day:'numeric',month:'long',year:'numeric'}); }
function trLongToIso(d){ if(!d) return ''; return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }

/* ───────── BUGÜN (Home) ───────── */
function agendaItemHTML(it){
  return `<div class="agenda-item">
    <div class="agenda-time"><div class="t">${escAttr(it.time)}</div></div>
    <div class="agenda-body">
      <div class="agenda-top"><span class="agenda-name">${escAttr(it.name)}</span><span class="pill ${statusClass(it.status)}">${it.status||'Beklemede'}</span></div>
      <div class="agenda-meta"><span>${it.guests??'—'} kişi</span><span class="dot">·</span><span>${escAttr(it.channel||'—')}</span><span class="dot">·</span><span>${escAttr(it.phone)}</span></div>
      ${it.note?`<div class="agenda-note">${escAttr(it.note)}</div>`:''}
    </div>
    <div class="row-actions">
      <button class="iconbtn" onclick="openRezModal('${it.id}')">${iconEdit()}</button>
      <button class="iconbtn danger" onclick="openDelModal('${it.id}')">${iconTrash()}</button>
    </div>
  </div>`;
}
function renderHome(){
  setPageSub();
  const now = new Date();
  const today0 = new Date(now.getFullYear(),now.getMonth(),now.getDate());
  const weekAhead = new Date(today0.getTime()+7*86400000);
  const active = RESERVATIONS.filter(it=>it.status!=='İptal Edildi');
  const todayItems = active.filter(it=>{ const d=parseTRDate(it.date); return d && sameDay(d,today0); }).sort((a,b)=>(a.time||'').localeCompare(b.time||''));
  const weekItems = active.filter(it=>{ const d=parseTRDate(it.date); return d && d>today0 && d<weekAhead; }).sort((a,b)=>{ const da=parseTRDate(a.date),db=parseTRDate(b.date); const diff=da-db; return diff!==0?diff:(a.time||'').localeCompare(b.time||''); });
  const pendingCount = RESERVATIONS.filter(it=>(it.status||'Beklemede')==='Beklemede').length;
  const todayGuests = todayItems.reduce((s,it)=>s+(Number(it.guests)||0),0);

  document.getElementById('homeChips').innerHTML = `
    <div class="chip-stat"><div class="n gold">${todayItems.length}</div><div class="l">Bugün</div></div>
    <div class="chip-stat"><div class="n">${todayGuests}</div><div class="l">Bugün Kişi</div></div>
    <div class="chip-stat"><div class="n ${pendingCount?'red':''}">${pendingCount}</div><div class="l">Bekleyen Onay</div></div>
    <div class="chip-stat"><div class="n">${weekItems.length}</div><div class="l">Yaklaşan 7 Gün</div></div>
  `;
  document.getElementById('homeToday').innerHTML = todayItems.length ? todayItems.map(agendaItemHTML).join('') :
    '<div class="empty">Bugün için rezervasyon yok.</div>';
  document.getElementById('homeWeek').innerHTML = weekItems.length ? weekItems.map(agendaItemHTML).join('') :
    '<div class="empty">Önümüzdeki 7 günde başka rezervasyon yok.</div>';
}

function rezCardHTML(it){

      <span class="agenda-name">${escAttr(it.name)}</span>

    </div>

    </div>
    <div class="agenda-meta">
      <span>${escAttr(it.phone)}</span><span class="dot">·</span><span>${escAttr(it.channel||'—')}</span>

      <button class="iconbtn danger" onclick="openDelModal('${it.id}')">${iconTrash()}</button>

function renderRezList(){
  const q = document.getElementById('rezSearch').value.trim().toLowerCase();
  const statusF = document.getElementById('rezStatusFilter').value;
  const channelF = document.getElementById('rezChannelFilter').value;
  const now = new Date();
  const today0 = new Date(now.getFullYear(),now.getMonth(),now.getDate());
  const weekAhead = new Date(today0.getTime()+7*86400000);

  let items = RESERVATIONS.filter(it=>{
    if(statusF!=='all' && (it.status||'Beklemede')!==statusF) return false;
    if(channelF!=='all' && ((it.channel||'Doğrudan').trim()||'Doğrudan')!==channelF) return false;
    if(q){ const hay=(it.name+' '+it.phone+' '+(it.email||'')).toLowerCase(); if(!hay.includes(q)) return false; }
    if(quickFilter!=='all'){
      const d = parseTRDate(it.date);
      if(!d) return false;
      if(quickFilter==='today' && !sameDay(d,today0)) return false;
      if(quickFilter==='week' && !(d>=today0 && d<weekAhead)) return false;
      if(quickFilter==='date' && dateFilterValue){
        const chosen = new Date(dateFilterValue+'T00:00:00');
        if(!sameDay(d,chosen)) return false;
      }
    }
    return true;
  });
  items = items.slice().sort((a,b)=>{
    const da=parseTRDate(a.date), db=parseTRDate(b.date);
    if(da&&db){ const diff=db-da; if(diff!==0) return diff; return (a.time||'').localeCompare(b.time||''); }
    if(da) return -1; if(db) return 1;
    return (b.createdAt||'').localeCompare(a.createdAt||'');
  });

  const list = document.getElementById('rezList');
  list.innerHTML = items.length ? items.map(rezCardHTML).join('') : '<div class="empty"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="11" cy="11" r="7"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>Kayıt bulunamadı.</div>';
}

/* ───────── REZERVASYON: ekle / düzenle ───────── */
function openRezModal(id){
  editingId = id || null;
  const it = editingId ? RESERVATIONS.find(x=>x.id===editingId) : null;
  document.getElementById('rzModalTitle').textContent = it ? 'Rezervasyonu Düzenle' : 'Rezervasyon Ekle';
  document.getElementById('rzName').value = it ? it.name : '';
  document.getElementById('rzPhone').value = it ? it.phone : '';
  document.getElementById('rzEmail').value = it ? (it.email||'') : '';
  document.getElementById('rzDate').value = it ? trLongToIso(parseTRDate(it.date)) : '';
  document.getElementById('rzTime').value = it ? it.time : '';
  document.getElementById('rzGuests').value = it ? (it.guests||1) : 2;
  document.getElementById('rzKonaklama').value = it ? (it.konaklama||'') : '';
  document.getElementById('rzChannel').value = it ? (it.channel||'Otel Müşterisi') : 'Otel Müşterisi';
  document.getElementById('rzStatus').value = it ? (it.status||'Onaylandı') : 'Onaylandı';
  document.getElementById('rzNote').value = it ? (it.note||'') : '';
  document.getElementById('rezModalBg').classList.add('on');

}
function openRezModalForDate(isoDate){
  openRezModal(null);
  document.getElementById('rzDate').value = isoDate;
}
function closeRezModal(){ document.getElementById('rezModalBg').classList.remove('on'); editingId=null; document.body.style.overflow=''; }
async function submitRez(){
  const name = document.getElementById('rzName').value.trim();
  const phone = document.getElementById('rzPhone').value.trim();
  const email = document.getElementById('rzEmail').value.trim();
  const dateRaw = document.getElementById('rzDate').value;
  const time = document.getElementById('rzTime').value.trim();
  const guests = document.getElementById('rzGuests').value;
  const konaklama = document.getElementById('rzKonaklama').value;
  const channel = document.getElementById('rzChannel').value;
  const status = document.getElementById('rzStatus').value;
  const note = document.getElementById('rzNote').value.trim();
  if(!name || !phone || !dateRaw || !time){ toast('Ad, telefon, tarih ve saat zorunlu'); return; }
  const date = isoToTRLong(dateRaw);
  const payload = { name, phone, email, date, time, guests, konaklama, channel, note, status };
  try{
    let r, j;
    if(editingId){
      payload.id = editingId;
      r = await fetch(API_REZ, { method:'PATCH', headers:{'Content-Type':'application/json','x-admin-key':ADMIN_KEY}, body: JSON.stringify(payload) });
      j = await r.json();
      if(r.ok && j.ok){
        const idx = RESERVATIONS.findIndex(x=>x.id===editingId);
        if(idx>-1) RESERVATIONS[idx] = j.item;
        toast('Rezervasyon güncellendi'); closeRezModal(); populateChannelFilter(); renderHome(); renderRezList(); renderStats(); if(curTab==='calendar') renderCalendar();
      } else toast('Hata: '+(j.error||r.status));
    } else {
      r = await fetch(API_REZ, { method:'POST', headers:{'Content-Type':'application/json','x-admin-key':ADMIN_KEY}, body: JSON.stringify(payload) });
      j = await r.json();
      if(r.ok && j.ok){ toast('Rezervasyon eklendi'); closeRezModal(); loadRez(); }
      else toast('Hata: '+(j.error||r.status));
    }
  }catch(e){ toast('Kaydedilemedi: '+e.message); }
}

/* ───────── REZERVASYON: sil ───────── */
function openDelModal(id){
  deletingId = id;
  const it = RESERVATIONS.find(x=>x.id===id);
  document.getElementById('delModalText').textContent = it ? `"${it.name}" (${it.date}, ${it.time}) rezervasyonunu silmek istediğinize emin misiniz?` : 'Bu rezervasyon talebini silmek istediğinize emin misiniz?';
  document.getElementById('delModalBg').classList.add('on');
  document.body.style.overflow='hidden';
}
function closeDelModal(){ document.getElementById('delModalBg').classList.remove('on'); deletingId=null; document.body.style.overflow=''; }
async function confirmDelete(){
  if(!deletingId) return;
  try{
    const r = await fetch(API_REZ+'?id='+encodeURIComponent(deletingId), { method:'DELETE', headers:{'x-admin-key':ADMIN_KEY} });
    const j = await r.json();
    if(r.ok && j.ok){
      RESERVATIONS = RESERVATIONS.filter(x=>x.id!==deletingId);
      toast('Rezervasyon silindi'); closeDelModal();
      populateChannelFilter(); renderHome(); renderRezList(); renderStats(); if(curTab==='calendar') renderCalendar();
    } else toast('Hata: '+(j.error||r.status));
  }catch(e){ toast('Silinemedi: '+e.message); }
}

/* ───────── TAKVİM ───────── */
let calYear = new Date().getFullYear();
let calMonth = new Date().getMonth();
let calSelDate = null;

function calShift(n){
  calMonth += n;
  if(calMonth<0){ calMonth=11; calYear--; }
  if(calMonth>11){ calMonth=0; calYear++; }
  renderCalendar();
}
function calToday(){ const n=new Date(); calYear=n.getFullYear(); calMonth=n.getMonth(); calSelDate=new Date(n.getFullYear(),n.getMonth(),n.getDate()); renderCalendar(); }

function renderCalendar(){
  document.getElementById('calLabel').textContent = TR_MONTHS_LONG[calMonth]+' '+calYear;
  document.getElementById('calDowRow').innerHTML = TR_DOW.map(d=>`<div class="cal-dow">${d}</div>`).join('');
  const first = new Date(calYear, calMonth, 1);
  const startOffset = (first.getDay()+6)%7;
  const daysInMonth = new Date(calYear, calMonth+1, 0).getDate();
  const gridStart = new Date(calYear, calMonth, 1-startOffset);
  const today = new Date(); const today0 = new Date(today.getFullYear(),today.getMonth(),today.getDate());

  const byDate = {};
  RESERVATIONS.forEach(it=>{
    const d = parseTRDate(it.date);
    if(!d) return;
    const k = dKey(d);
    if(!byDate[k]) byDate[k] = [];
    byDate[k].push(it);
  });

  // Yoğunluk: iptal hariç toplam kişi sayısına göre, ay içindeki en yoğun güne göre bağıl ölçek
  let maxGuests = 0;
  Object.values(byDate).forEach(list=>{
    const g = list.filter(it=>it.status!=='İptal Edildi').reduce((s,it)=>s+(Number(it.guests)||0),0);
    if(g>maxGuests) maxGuests = g;
  });

  let cellsHtml = '';
  const totalCells = Math.ceil((startOffset+daysInMonth)/7)*7;
  for(let i=0;i<totalCells;i++){
    const d = new Date(gridStart.getFullYear(),gridStart.getMonth(),gridStart.getDate()+i);
    const k = dKey(d);
    const list = byDate[k]||[];
    const active = list.filter(it=>it.status!=='İptal Edildi');
    const guests = active.reduce((s,it)=>s+(Number(it.guests)||0),0);
    const level = guests && maxGuests ? Math.min(4, Math.max(1, Math.ceil(guests/maxGuests*4))) : 0;
    const inMonth = d.getMonth()===calMonth;
    const isToday = sameDay(d, today0);
    const isSel = calSelDate && sameDay(d, calSelDate);
    cellsHtml += `<button class="cal-cell ${inMonth?'':'off'} ${isToday?'today':''} ${isSel?'sel':''} load-${level}" onclick="selectCalDay('${k}')">
      <div class="dnum">${d.getDate()}</div>
      ${active.length?`<div class="cal-count">${active.length}</div>`:''}
    </button>`;
  }
  document.getElementById('calGrid').innerHTML = cellsHtml;

  if(!calSelDate) calSelDate = today0;
  renderDayPanel(byDate);
}
function selectCalDay(key){
  const [y,m,d] = key.split('-').map(Number);
  calSelDate = new Date(y, m-1, d);
  renderCalendar();
}
function renderDayPanel(byDate){
  const k = dKey(calSelDate);
  const list = (byDate[k]||[]).slice().sort((a,b)=>(a.time||'').localeCompare(b.time||''));
  const label = calSelDate.toLocaleDateString('tr-TR',{day:'numeric',month:'long',weekday:'long'});
  const iso = trLongToIso(calSelDate);
  document.getElementById('dayPanelTitle').textContent = label + (list.length? ' · '+list.length+' rez.' : '');
  const panel = document.getElementById('dayPanelList');
  const addRow = `<button class="btn sm" style="align-self:flex-start" onclick="openRezModalForDate('${iso}')">+ Bu Güne Rezervasyon Ekle</button>`;
  if(!list.length){ panel.innerHTML = addRow + '<div class="empty">Bu tarihte rezervasyon yok.</div>'; return; }
  panel.innerHTML = addRow + list.map(agendaItemHTML).join('');
}

/* ───────── SVG grafikler (açık tema) ───────── */
function truncLabel(s, max=17){ s=String(s); return s.length>max ? s.slice(0,max-1)+'…' : s; }

/* ── Floating chart tooltip ── */
function positionTip(e){
  const tip = document.getElementById('chartTip');
  const x = e.clientX, y = e.clientY, pad = 14;
  const tw = tip.offsetWidth, th = tip.offsetHeight;
  let left = x+pad, top = y-th-pad;
  if(left+tw > window.innerWidth-8) left = x-tw-pad;
  if(top < 8) top = y+pad;
  tip.style.left = left+'px'; tip.style.top = top+'px';
}
function showTip(e, html){ const tip=document.getElementById('chartTip'); tip.innerHTML=html; tip.classList.add('on'); positionTip(e); }
let tipHideTimer=null;
function bindTipEvents(){
  document.addEventListener('pointerover', e=>{ const t=e.target.closest('[data-tip]'); if(t) showTip(e, t.getAttribute('data-tip')); });
  document.addEventListener('pointermove', e=>{ const t=e.target.closest('[data-tip]'); if(t) positionTip(e); });
  document.addEventListener('pointerout', e=>{ const t=e.target.closest('[data-tip]'); if(t) document.getElementById('chartTip').classList.remove('on'); });
  document.addEventListener('pointerdown', e=>{ const t=e.target.closest('[data-tip]'); if(t){ showTip(e, t.getAttribute('data-tip')); clearTimeout(tipHideTimer); tipHideTimer=setTimeout(()=>document.getElementById('chartTip').classList.remove('on'), 1800); } });
}
function animateCharts(root){
  const bars = root.querySelectorAll('.bar-grow,.hbar-grow');
  const donuts = root.querySelectorAll('.donut-seg');
  requestAnimationFrame(()=>requestAnimationFrame(()=>{
    bars.forEach(el=>el.classList.add('on'));
    donuts.forEach(el=>{ el.style.strokeDasharray = el.dataset.final; });
  }));
}

function svgBarChart(points, opts={}){
  const w = 520, h = opts.h || 170, padL = 26, padR = 8, padT = 16, padB = opts.padB || 30;
  const innerW = w-padL-padR, innerH = h-padT-padB;
  const max = Math.max(1, ...points.map(p=>p.value));
  const n = Math.max(points.length,1);
  const slot = innerW/n;
  const barW = Math.max(3, Math.min(slot*0.55, 26));
  const rotate = n > 10;
  let bars='', labels='';
  points.forEach((p,i)=>{
    const bh = (p.value/max)*innerH;
    const x = padL + i*slot + (slot-barW)/2;
    const y = padT + innerH - bh;
    const tip = escAttr(p.label+': '+p.value);
    bars += `<rect class="bar-grow" data-tip="${tip}" style="transition-delay:${(i*18).toFixed(0)}ms" x="${x.toFixed(1)}" y="${y.toFixed(1)}" width="${barW.toFixed(1)}" height="${Math.max(bh,1).toFixed(1)}" rx="3" fill="url(#barGrad)"></rect>`;
    if(p.value>0) bars += `<text x="${(x+barW/2).toFixed(1)}" y="${(y-4).toFixed(1)}" text-anchor="middle" font-size="9" fill="#16294A" font-weight="700">${p.value}</text>`;
    const ly = h-10;
    const lx = (x+barW/2).toFixed(1);
    labels += `<text x="${lx}" y="${ly}" text-anchor="${rotate?'end':'middle'}" font-size="8.5" fill="#7C8698" transform="${rotate?`rotate(-45 ${lx} ${ly})`:''}">${p.label}</text>`;
  });
  return `<svg viewBox="0 0 ${w} ${h}" width="100%" height="${h}" preserveAspectRatio="xMidYMid meet">
    <defs><linearGradient id="barGrad" x1="0" y1="1" x2="0" y2="0"><stop offset="0%" stop-color="#7C97C4"/><stop offset="100%" stop-color="#2E4C81"/></linearGradient></defs>
    <line x1="${padL}" y1="${padT+innerH}" x2="${padL+innerW}" y2="${padT+innerH}" stroke="#D9DFEA"/>
    ${bars}${labels}
  </svg>`;
}
function svgGroupedChart(points, opts={}){
  const w = 520, h = opts.h || 190, padL = 26, padR = 8, padT = 16, padB = 32;
  const innerW = w-padL-padR, innerH = h-padT-padB;
  const max = Math.max(1, ...points.map(p=>Math.max(p.a,p.b)));
  const n = Math.max(points.length,1);
  const slot = innerW/n;
  const barW = Math.max(3, Math.min(slot*0.32, 14));
  const gap = 3;
  const rotate = n > 8;
  let bars='', labels='';
  points.forEach((p,i)=>{
    const cx = padL + i*slot + slot/2;
    const ah = (p.a/max)*innerH, bh = (p.b/max)*innerH;
    const ax = cx-gap/2-barW, ay = padT+innerH-ah;
    const bx = cx+gap/2, by = padT+innerH-bh;
    const delay = (i*18).toFixed(0)+'ms';
    bars += `<rect class="bar-grow" data-tip="${escAttr(p.label+' · Talep: '+p.a)}" style="transition-delay:${delay}" x="${ax.toFixed(1)}" y="${ay.toFixed(1)}" width="${barW}" height="${Math.max(ah,1).toFixed(1)}" rx="2.5" fill="#2E4C81"></rect>`;
    bars += `<rect class="bar-grow" data-tip="${escAttr(p.label+' · Kişi: '+p.b)}" style="transition-delay:${delay}" x="${bx.toFixed(1)}" y="${by.toFixed(1)}" width="${barW}" height="${Math.max(bh,1).toFixed(1)}" rx="2.5" fill="#2E7D5B"></rect>`;
    const ly = h-10;
    labels += `<text x="${cx.toFixed(1)}" y="${ly}" text-anchor="${rotate?'end':'middle'}" font-size="8.5" fill="#7C8698" transform="${rotate?`rotate(-45 ${cx.toFixed(1)} ${ly})`:''}">${p.label}</text>`;
  });
  return `<svg viewBox="0 0 ${w} ${h}" width="100%" height="${h}" preserveAspectRatio="xMidYMid meet">
    <line x1="${padL}" y1="${padT+innerH}" x2="${padL+innerW}" y2="${padT+innerH}" stroke="#D9DFEA"/>
    ${bars}${labels}
  </svg>`;
}
function svgHBarChart(points, opts={}){
  const w = 520, rowH = 26, padL = 4, padR = 40, labelW = 108;
  const h = Math.max(points.length,1)*rowH + 12;
  const max = Math.max(1, ...points.map(p=>p.value));
  const innerW = w-labelW-padR-padL;
  let rows='';

    const y = i*rowH + 6;

    rows += `<text x="${labelW+bw+6}" y="${y+13}" font-size="10" fill="#16294A" font-weight="700">${p.value}</text>`;
  });
  return `<svg viewBox="0 0 ${w} ${h}" width="100%" height="${h}">
    <defs><linearGradient id="hbarGrad" x1="0" y1="0" x2="1" y2="0"><stop offset="0%" stop-color="#B9C7E0"/><stop offset="100%" stop-color="#2E4C81"/></linearGradient></defs>
    ${rows}

const DONUT_COLORS = ['#2E4C81','#2E7D5B','#C1443A','#B07A17','#7C97C4','#8891A0','#5C4A8A'];
function svgDonutChart(points, opts={}){
  const size = 128, stroke = 20, r = (size-stroke)/2, cx = size/2, cy = size/2;
  const circ = 2*Math.PI*r;
  const total = points.reduce((s,p)=>s+p.value,0) || 1;
  let offset = 0, segs = '';
  points.forEach((p,i)=>{
    const frac = p.value/total, len = frac*circ, gapLen = circ-len;
    const color = DONUT_COLORS[i%DONUT_COLORS.length];
    const pct = Math.round(frac*100);
    const tip = escAttr(p.label+': '+p.value+' (%'+pct+')');
    segs += `<circle class="donut-seg" data-tip="${tip}" data-final="${len.toFixed(1)} ${gapLen.toFixed(1)}" style="transition-delay:${(i*90).toFixed(0)}ms" cx="${cx}" cy="${cy}" r="${r}" fill="none" stroke="${color}" stroke-width="${stroke}" stroke-dasharray="0 ${circ.toFixed(1)}" stroke-dashoffset="${(-offset).toFixed(1)}" transform="rotate(-90 ${cx} ${cy})"></circle>`;
    offset += len;
  });
  const legend = points.map((p,i)=>{
    const pct = Math.round(p.value/total*100);
    const color = DONUT_COLORS[i%DONUT_COLORS.length];
    const tip = escAttr(p.label+': '+p.value+' (%'+pct+')');
    return `<div class="donut-legend-row" data-tip="${tip}"><i style="background:${color}"></i><span class="ll">${escAttr(truncLabel(p.label,22))}</span><span class="lv">${p.value}</span><span class="lp">%${pct}</span></div>`;
  }).join('');
  return `<div class="donut-row">
    <div class="donut-wrap"><svg viewBox="0 0 ${size} ${size}">
      <circle cx="${cx}" cy="${cy}" r="${r}" fill="none" stroke="rgba(15,25,45,.07)" stroke-width="${stroke}"/>
      ${segs}
    </svg><div class="donut-center"><div class="dc-n">${total}</div><div class="dc-l">Toplam</div></div></div>
    <div class="donut-legend">${legend}</div>
  </div>`;
}

/* ───────── İSTATİSTİKLER ───────── */
function animateNumber(el, target, decimals){
  const t0 = performance.now(), dur = 700;
  function step(t){
    const p = Math.min(1,(t-t0)/dur);
    const eased = 1-Math.pow(1-p,3);
    const val = target*eased;
    el.textContent = decimals ? val.toFixed(decimals) : Math.round(val).toLocaleString('tr-TR');
    if(p<1) requestAnimationFrame(step);
    else el.textContent = decimals ? target.toFixed(decimals) : target.toLocaleString('tr-TR');
  }
  requestAnimationFrame(step);
}
const STAT_ICONS = {
  total:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><line x1="4" y1="7" x2="20" y2="7"/><line x1="4" y1="12" x2="20" y2="12"/><line x1="4" y1="17" x2="14" y2="17"/></svg>',
  clock:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3.5 3.5"/></svg>',
  calendar:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="5" width="18" height="16" rx="3"/><line x1="3" y1="10" x2="21" y2="10"/><line x1="8" y1="3" x2="8" y2="7"/><line x1="16" y1="3" x2="16" y2="7"/></svg>',
  warn:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M12 9v4"/><circle cx="12" cy="16.2" r=".3" fill="currentColor" stroke="none"/><path d="M10.3 4.5L2.7 18a1.6 1.6 0 001.4 2.4h16a1.6 1.6 0 001.4-2.4L13.7 4.5a1.6 1.6 0 00-2.8 0z"/></svg>',
  users:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="9" cy="8" r="3.2"/><path d="M3 20c0-3.3 2.7-6 6-6s6 2.7 6 6"/><circle cx="17.5" cy="9" r="2.4"/><path d="M15.8 14.2c2.6.3 4.7 2.5 4.7 5.3"/></svg>',
  avg:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 19V9M12 19V5M20 19v-7"/></svg>',
};
function statCardHTML(id, iconKey, label, value, decimals, warn){
  return `<div class="stat-card"><div class="ic${warn?' warn':''}">${STAT_ICONS[iconKey]}</div><div class="n${warn?' warn':''}" id="${id}">0</div><div class="l">${label}</div></div>`;
}

let trendGranularity = 'day';
function aggregateTrend(items, granularity){
  const now = new Date();
  const map = {}, order = [];
  if(granularity==='day'){
    for(let i=29;i>=0;i--){ const d=new Date(now.getFullYear(),now.getMonth(),now.getDate()-i); const k=dKey(d); map[k]={label:dLabel(d),a:0,b:0}; order.push(k); }
    items.forEach(it=>{ const d=it.createdAt?new Date(it.createdAt):null; if(!d||isNaN(d))return; const k=dKey(new Date(d.getFullYear(),d.getMonth(),d.getDate())); if(map[k]){ map[k].a++; map[k].b+=Number(it.guests)||0; } });
  } else if(granularity==='week'){
    for(let i=11;i>=0;i--){
      const ref = new Date(now.getTime()-i*7*86400000);
      const dow = (ref.getDay()+6)%7;
      const monday = new Date(ref.getFullYear(),ref.getMonth(),ref.getDate()-dow);
      const k = dKey(monday);
      if(!map[k]){ map[k]={label:dLabel(monday),a:0,b:0}; order.push(k); }
    }
    items.forEach(it=>{ const d=it.createdAt?new Date(it.createdAt):null; if(!d||isNaN(d))return; const dow=(d.getDay()+6)%7; const monday=new Date(d.getFullYear(),d.getMonth(),d.getDate()-dow); const k=dKey(monday); if(map[k]){ map[k].a++; map[k].b+=Number(it.guests)||0; } });
  } else {
    for(let i=11;i>=0;i--){
      const d = new Date(now.getFullYear(),now.getMonth()-i,1);
      const k = d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0');
      map[k] = { label: TR_MONTHS_LONG[d.getMonth()].slice(0,3), a:0, b:0 }; order.push(k);
    }
    items.forEach(it=>{ const d=it.createdAt?new Date(it.createdAt):null; if(!d||isNaN(d))return; const k=d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0'); if(map[k]){ map[k].a++; map[k].b+=Number(it.guests)||0; } });
  }
  return order.map(k=>map[k]);
}
function setTrendGranularity(g){
  trendGranularity = g;
  document.querySelectorAll('#trendSeg button').forEach(b=>b.classList.toggle('on', b.dataset.g===g));
  renderTrendChart();
}
function renderTrendChart(){
  const wrap = document.getElementById('trendChartWrap');
  if(!wrap) return;
  const points = aggregateTrend(RESERVATIONS, trendGranularity);
  const subLabel = trendGranularity==='day' ? 'Son 30 gün · gönderim tarihine göre' : trendGranularity==='week' ? 'Son 12 hafta · gönderim tarihine göre' : 'Son 12 ay · gönderim tarihine göre';
  document.getElementById('trendSub').textContent = subLabel;
  wrap.innerHTML = `<div class="chart-legend"><span><i style="background:#2E4C81"></i>Talep</span><span><i style="background:#2E7D5B"></i>Kişi</span></div>${svgGroupedChart(points,{h:180})}`;
  animateCharts(wrap);
}

function renderStats(){
  const items = RESERVATIONS;
  const now = new Date();
  const weekAgo = new Date(now.getTime()-7*86400000);
  const monthAgo = new Date(now.getTime()-30*86400000);
  const talep7 = items.filter(it=>new Date(it.createdAt)>=weekAgo).length;
  const talep30 = items.filter(it=>new Date(it.createdAt)>=monthAgo).length;
  const totalGuests = items.reduce((s,it)=>s+(Number(it.guests)||0),0);
  const withGuests = items.filter(it=>Number(it.guests)>0).length;
  const avgGuests = withGuests ? (totalGuests/withGuests) : 0;
  const pendingCount = items.filter(it=>(it.status||'Beklemede')==='Beklemede').length;

  document.getElementById('statGrid').innerHTML =
    statCardHTML('stTotal','total','Toplam Talep') +
    statCardHTML('stWeek','clock','Son 7 Gün') +
    statCardHTML('stMonth','calendar','Son 30 Gün') +
    statCardHTML('stPending','warn','Bekleyen Onay',0,pendingCount>0) +
    statCardHTML('stGuests','users','Toplam Kişi') +
    statCardHTML('stAvg','avg','Ort. Kişi / Talep');
  animateNumber(document.getElementById('stTotal'), items.length);
  animateNumber(document.getElementById('stWeek'), talep7);
  animateNumber(document.getElementById('stMonth'), talep30);
  animateNumber(document.getElementById('stPending'), pendingCount);
  animateNumber(document.getElementById('stGuests'), totalGuests);
  animateNumber(document.getElementById('stAvg'), avgGuests, 1);

  const grid = document.getElementById('statCharts');
  if(!items.length){ grid.innerHTML = '<div class="chart-card"><div class="chart-empty">Grafikler için henüz veri yok.</div></div>'; return; }

  const byDate = {};
  items.forEach(it=>{ const d=parseTRDate(it.date); const label=d?dLabel(d):(it.date||'—'); const key=d?dKey(d):('x:'+label); if(!byDate[key]) byDate[key]={label,sortD:d,a:0,b:0}; byDate[key].a++; byDate[key].b+=Number(it.guests)||0; });
  const datePoints = Object.values(byDate).sort((x,y)=>{ if(x.sortD&&y.sortD) return x.sortD-y.sortD; return x.sortD?-1:(y.sortD?1:0); });

  const konMap = {};
  items.forEach(it=>{ const k=(it.konaklama||'Belirtilmemiş').trim()||'Belirtilmemiş'; konMap[k]=(konMap[k]||0)+1; });
  const konPoints = Object.entries(konMap).map(([label,value])=>({label,value})).sort((a,b)=>b.value-a.value);

  const chMap = {};
  items.forEach(it=>{ const k=(it.channel||'Doğrudan').trim()||'Doğrudan'; chMap[k]=(chMap[k]||0)+1; });
  const chPoints = Object.entries(chMap).map(([label,value])=>({label,value})).sort((a,b)=>b.value-a.value);

  const stMap = {};
  items.forEach(it=>{ const k=it.status||'Beklemede'; stMap[k]=(stMap[k]||0)+1; });
  const stOrder = ['Beklemede','Onaylandı','Tamamlandı','İptal Edildi'];
  const stPoints = stOrder.filter(k=>stMap[k]).map(label=>({label,value:stMap[label]}));

  const hrMap = {};
  items.forEach(it=>{ const t=(it.time||'').trim(); if(!t)return; hrMap[t]=(hrMap[t]||0)+1; });
  const hrPoints = Object.entries(hrMap).map(([label,value])=>({label,value})).sort((a,b)=>a.label.localeCompare(b.label));

  grid.innerHTML = `
    <div class="chart-card">
      <div class="chart-card-head">
        <div><h3>Talep Trendi</h3><div class="sub" id="trendSub"></div></div>
        <div class="seg sm" id="trendSeg">
          <button class="on" data-g="day" onclick="setTrendGranularity('day')">Gün</button>
          <button data-g="week" onclick="setTrendGranularity('week')">Hafta</button>
          <button data-g="month" onclick="setTrendGranularity('month')">Ay</button>
        </div>
      </div>
      <div id="trendChartWrap"></div>
    </div>
    <div class="chart-card"><h3>Rezervasyon Tarihine Göre Talep &amp; Kişi</h3><div class="sub">Müşterinin seçtiği tarihe göre gruplanmış</div>
      <div class="chart-legend"><span><i style="background:#2E4C81"></i>Talep</span><span><i style="background:#2E7D5B"></i>Kişi</span></div>${svgGroupedChart(datePoints)}</div>
    <div class="chart-card"><h3>Kaynak Dağılımı</h3><div class="sub">Otel müşterisi, Instagram, telefon, walk-in</div>${svgDonutChart(chPoints)}</div>
    <div class="chart-card"><h3>Konaklama Tercihi</h3><div class="sub">Tüm taleplerdeki oran</div>${svgDonutChart(konPoints)}</div>
    <div class="chart-card"><h3>Durum Dağılımı</h3><div class="sub">Beklemede / onaylandı / tamamlandı / iptal</div>${svgDonutChart(stPoints)}</div>
    <div class="chart-card"><h3>Saat Dağılımı</h3><div class="sub">En çok tercih edilen rezervasyon saatleri</div>${svgHBarChart(hrPoints)}</div>
  `;
  renderTrendChart();
  animateCharts(grid);
}

setPageSub();
bindTipEvents();

  document.getElementById('login').style.display='none';
  document.getElementById('app').style.display='block';
  loadAll();
}
